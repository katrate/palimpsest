[package]
name = "palin"
version = "0.5.1"
edition = "2024"
description = "✦ Palimpsest — Git-inspired versioned snapshot browser with a professional TUI. Track, browse, compare, and restore your project's history through time."
authors = ["Palimpsest"]

[dependencies]
# CLI framework
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28" }

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Hashing
sha2 = "0.10"
hex = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Diff engine
similar = "2"

# Regex for grep
regex = "1"

# Compression (Phase 3, but included for scaffolding)
zstd = { version = "0.13", optional = true }

# Archiving
zip = "2"

# Error handling
anyhow = "1"
thiserror = "2"

# Async (Phase 3)
tokio = { version = "1", features = ["full"], optional = true }

# Directories
directories = "6"

# Time
chrono = "0.4"

# Progress bar
indicatif = "0.17"

# Glob pattern matching
globset = "0.4"
ignore = "0.4"

# Unicode display width
unicode-width = "0.2"

# HTTP client (for auto-update)
ureq = { version = "2", default-features = false, features = ["native-tls", "gzip"] }

# Tar archive support
tar = "0.4"
flate2 = "1"

# OpenSSL vendored — only on Linux (native-tls uses it); macOS uses Security.framework, Windows uses schannel
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[features]
default = []
daemon = ["tokio", "zstd"]

[[bin]]
name = "palin"
path = "src/main.rs"
